<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Reader</title>
  <meta name="description" content="Pembaca dokumen simpel: Word, Excel, PowerPoint, PDF, CSV, ZIP, RAR, gambar, teks.">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="stylesheet" href="style.css">

  <!-- Library pembaca format (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36"> <defs> <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#2563eb"/> <stop offset="1" stop-color="#7c3aed"/> </linearGradient> <linearGradient id="paper1" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#ffffff"/> <stop offset="1" stop-color="#e8ecf7"/> </linearGradient> </defs> <rect width="36" height="36" rx="110" fill="url(#bg1)"/> <!-- Document --> <path d="M150 70 H300 L370 140 V340 a16 16 0 0 1 -16 16 H150 a16 16 0 0 1 -16 -16 V86 a16 16 0 0 1 16 -16 Z" fill="url(#paper1)"/> <path d="M300 70 V124 a16 16 0 0 0 16 16 H370 Z" fill="#c7d2fe"/> <!-- Lines of text --> <rect x="168" y="150" width="110" height="14" rx="7" fill="#93a4d6"/> <rect x="168" y="184" width="168" height="14" rx="7" fill="#93a4d6"/> <rect x="168" y="218" width="140" height="14" rx="7" fill="#93a4d6"/> <rect x="168" y="252" width="90" height="14" rx="7" fill="#93a4d6"/> <!-- Magnifier --> <circle cx="320" cy="290" r="52" fill="#ffffff" fill-opacity="0.35" stroke="#f59e0b" stroke-width="18"/> <line x1="358" y1="328" x2="400" y2="370" stroke="#f59e0b" stroke-width="24" stroke-linecap="round"/> <!-- Label --> <text x="256" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="62" letter-spacing="2" fill="#ffffff">FILE READER</text> </svg>
      <span>File Reader</span>
    </div>
    <label class="btn primary">
      Buka File
      <input type="file" id="fileInput" hidden>
    </label>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="120" height="120" role="img" aria-label="FILE READER"> <defs> <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#2563eb"/> <stop offset="1" stop-color="#7c3aed"/> </linearGradient> <linearGradient id="paper2" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#ffffff"/> <stop offset="1" stop-color="#e8ecf7"/> </linearGradient> </defs> <rect width="120" height="120" role="img" aria-label="FILE READER" rx="110" fill="url(#bg2)"/> <!-- Document --> <path d="M150 70 H300 L370 140 V340 a16 16 0 0 1 -16 16 H150 a16 16 0 0 1 -16 -16 V86 a16 16 0 0 1 16 -16 Z" fill="url(#paper2)"/> <path d="M300 70 V124 a16 16 0 0 0 16 16 H370 Z" fill="#c7d2fe"/> <!-- Lines of text --> <rect x="168" y="150" width="110" height="14" rx="7" fill="#93a4d6"/> <rect x="168" y="184" width="168" height="14" rx="7" fill="#93a4d6"/> <rect x="168" y="218" width="140" height="14" rx="7" fill="#93a4d6"/> <rect x="168" y="252" width="90" height="14" rx="7" fill="#93a4d6"/> <!-- Magnifier --> <circle cx="320" cy="290" r="52" fill="#ffffff" fill-opacity="0.35" stroke="#f59e0b" stroke-width="18"/> <line x1="358" y1="328" x2="400" y2="370" stroke="#f59e0b" stroke-width="24" stroke-linecap="round"/> <!-- Label --> <text x="256" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="62" letter-spacing="2" fill="#ffffff">FILE READER</text> </svg>
      <h1>Seret &amp; lepas file di sini</h1>
      <p>atau klik <b>Buka File</b>. File dibaca langsung di browser, tidak diunggah ke mana pun.</p>
      <div class="formats">
        <span>DOCX</span><span>XLSX</span><span>XLS</span><span>CSV</span><span>PPTX</span>
        <span>PDF</span><span>ZIP</span><span>RAR</span><span>TXT</span><span>JSON</span>
        <span>MD</span><span>Gambar</span><span>Audio</span><span>Video</span>
      </div>
    </section>

    <section id="viewerWrap" class="viewer-wrap" hidden>
      <div class="filebar">
        <button id="backBtn" class="btn" hidden>&larr; Kembali</button>
        <div id="fileInfo" class="file-info"></div>
        <button id="closeBtn" class="btn">Tutup</button>
      </div>
      <div id="viewer" class="viewer"></div>
    </section>
  </main>

  <footer>File Reader &middot; open source &middot; 100% di browser</footer>

  <script src="app.js"></script>
</body>
</html>
